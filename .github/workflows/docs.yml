name: docs

# Build check only. Deploys run in Cloudflare Workers Builds (see site/wrangler.jsonc).
on:
  push:
    branches: [master]
    paths: ['skills/**', 'site/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['skills/**', 'site/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
